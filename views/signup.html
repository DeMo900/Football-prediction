  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Fira+Code:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    :root { --bg: #070B07; --surface: #0E160E; --cp-green: #39FF14; --cp-cyan: #00F0FF; --cp-magenta: #FF2BD6; --cp-yellow: #FFD700; --cp-red: #FF3355; }
    .material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }
    .scanlines-bg { background-image: repeating-linear-gradient(0deg, rgba(57,255,20,0.03) 0px, rgba(57,255,20,0.03) 1px, transparent 1px, transparent 3px); }
    .card { padding: 1.5rem; border: 1px solid rgba(57,255,20,.3); background: rgba(57,255,20,.05); }
    .button { padding: 1rem 2rem; border: 1px solid var(--cp-green); background: var(--cp-green); color: #000; font-weight: 700; box-shadow: 0 0 20px rgba(57,255,20,.5); }
    .button:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--cp-cyan); outline-offset: 3px; }
    .neon-heading { text-shadow: 0 0 12px rgba(57,255,20,0.45); }
    @keyframes glitch { 0% { text-shadow: 2px 0 var(--cp-magenta), -2px 0 var(--cp-cyan); } 50% { text-shadow: -2px 0 var(--cp-magenta), 2px 0 var(--cp-cyan); } 100% { text-shadow: 2px 0 var(--cp-magenta), -2px 0 var(--cp-cyan); } }
    .glitch:hover { animation: glitch .3s steps(2) infinite; }
    @media (prefers-reduced-motion: reduce) { .glitch:hover { animation: none !important; } }
  </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-[1024px] scanlines-bg" data-stitch-vh="min-h-[1024px]===min-h-screen">
  <div class="min-h-[1024px] grid grid-cols-1 md:grid-cols-2" data-stitch-vh="min-h-[1024px]===min-h-screen">

    <!-- Left Brand / HUD Art Panel -->
    <aside class="hidden md:flex relative flex-col justify-between p-gutter-xl border-r border-primary/30 bg-surface-container overflow-hidden">
      <img src="https://lh3.googleusercontent.com/aida/ALJJyrBDckc9HMFUzh_y9ud92vkTFkTtgiCREzqvPhMvcTv16cN6KGu21rKTPbGHLcv4Rkh0f2PaHzyIxq7jJthoQfeEoMGCDp-qNhwEauMv8ejC1tUZLjMKU0rKLdpZ4xE2sofDinTlujTqEddwoQX1k3JHkJ5jCY1UfQuybqoi0WZqVQT3b2QBPo_pwaMMxSaAykKbWZO2vvuXEnnhzM-th9izZNoxdrceFBYcSu85zRht5KGJVElKeHJ6" alt="Cyberpunk football stadium HUD" class="absolute inset-0 w-full h-full object-cover opacity-50">
      <div class="absolute inset-0 bg-surface/65"></div>
      <div class="relative z-10 flex items-center gap-gutter-sm text-primary">
        <span class="material-symbols-outlined text-headline-lg" aria-hidden="true">bolt</span>
        <span data-design-text-token="headline-md" class="glitch font-headline text-headline-md uppercase neon-heading">VOLT BET</span>
      </div>
      <div class="relative z-10 flex flex-col gap-gutter-md max-w-md">
        <h1 data-design-text-token="display-lg" class="font-headline text-display-lg text-primary uppercase neon-heading">DEPLOY YOUR PROFILE.</h1>
        <p data-design-text-token="body-lg" class="text-body-lg text-on-surface">
          Start with 1,000.00 virtual coins and compete on the weekly Night-City leaderboard.
        </p>
      </div>
    </aside>

    <!-- Right Form Panel -->
    <main class="flex items-center justify-center p-gutter-lg">
      <div class="card rounded-md w-full max-w-md flex flex-col gap-gutter-lg">
        <header class="flex flex-col gap-gutter-xs">
          <h2 data-design-text-token="headline-md" class="glitch font-headline text-headline-md text-primary uppercase neon-heading">CREATE ACCOUNT</h2>
          <p data-design-text-token="body-md" class="text-body-md text-on-surface-variant">Register a new VOLT BET operator handle.</p>
        </header>

        <form class="flex flex-col gap-gutter-md" novalidate>
          <label class="flex flex-col gap-gutter-xs">
            <span data-design-text-token="label-sm" class="text-label-sm text-on-surface uppercase">Username</span>
            <input type="text" minlength="3" maxlength="20" placeholder="v_mercer" class="min-h-[44px] w-full rounded-sm border border-primary/30 bg-surface-container px-gutter-md py-2.5 text-body-md text-on-surface placeholder:text-on-surface-variant focus:border-secondary focus:ring-0">
            <span data-design-text-token="label-sm" class="text-label-sm text-on-surface-variant">3–20 characters</span>
          </label>

          <label class="flex flex-col gap-gutter-xs">
            <span data-design-text-token="label-sm" class="text-label-sm text-on-surface uppercase">Email</span>
            <input type="email" placeholder="operator@voltbet.gg" class="min-h-[44px] w-full rounded-sm border border-primary/30 bg-surface-container px-gutter-md py-2.5 text-body-md text-on-surface placeholder:text-on-surface-variant focus:border-secondary focus:ring-0">
            <span data-design-text-token="label-sm" class="text-label-sm text-on-surface-variant">Used for password recovery</span>
          </label>

          <div class="flex flex-col gap-gutter-xs">
            <label for="signup-password" data-design-text-token="label-sm" class="text-label-sm text-on-surface uppercase">Password</label>
            <div class="relative flex items-center">
              <input id="signup-password" type="password" minlength="8" placeholder="••••••••" class="min-h-[44px] w-full rounded-sm border border-primary/30 bg-surface-container pl-gutter-md pr-12 py-2.5 text-body-md text-on-surface placeholder:text-on-surface-variant focus:border-secondary focus:ring-0">
              <button type="button" onclick="const i=document.getElementById(&#39;signup-password&#39;); i.type=i.type===&#39;password&#39;?&#39;text&#39;:&#39;password&#39;;" aria-label="Toggle password visibility" class="absolute right-0 top-0 h-full w-11 inline-flex items-center justify-center text-on-surface-variant hover:text-secondary cursor-pointer">
                <span class="material-symbols-outlined text-title-md" aria-hidden="true">visibility</span>
              </button>
            </div>
            <span data-design-text-token="label-sm" class="text-label-sm text-on-surface-variant">Minimum 8 characters</span>
          </div>

          <div class="flex flex-col gap-gutter-xs">
            <label for="signup-confirm" data-design-text-token="label-sm" class="text-label-sm text-on-surface uppercase">Confirm Password</label>
            <div class="relative flex items-center">
              <input id="signup-confirm" type="password" aria-invalid="true" placeholder="••••••••" class="min-h-[44px] w-full rounded-sm border border-error bg-surface-container pl-gutter-md pr-12 py-2.5 text-body-md text-on-surface placeholder:text-on-surface-variant focus:border-error focus:ring-0">
              <button type="button" onclick="const i=document.getElementById(&#39;signup-confirm&#39;); i.type=i.type===&#39;password&#39;?&#39;text&#39;:&#39;password&#39;;" aria-label="Toggle confirm password visibility" class="absolute right-0 top-0 h-full w-11 inline-flex items-center justify-center text-on-surface-variant hover:text-secondary cursor-pointer">
                <span class="material-symbols-outlined text-title-md" aria-hidden="true">visibility</span>
              </button>
            </div>
            <span role="alert" data-design-text-token="label-sm" class="inline-flex items-center gap-1.5 text-label-sm text-error">
              <span class="material-symbols-outlined text-title-md" aria-hidden="true">error</span>
              <span>Passwords must match</span>
            </span>
          </div>

          <button type="submit" class="button w-full min-h-[44px] rounded-sm font-label uppercase tracking-wider cursor-pointer mt-2">
            <span data-design-text-token="label-lg" class="text-label-lg">INITIALIZE ACCOUNT</span>
          </button>
        </form>

        <footer class="text-center border-t border-primary/20 pt-gutter-md">
          <p data-design-text-token="body-md" class="text-body-md text-on-surface-variant">
            Already registered? <a href="#" class="text-secondary font-bold hover:underline">Sign in</a>
          </p>
        </footer>
      </div>
    </main>

  </div>


</body></html>
